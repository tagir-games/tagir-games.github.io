<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Растровый редактор с регулировкой толщины и загрузкой PNG</title>
<style>
  body {
    margin: 0; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #e2e8f0;
    display: flex; flex-direction: column; height: 100vh;
  }
  #tools {
    background:#fff;
    padding:12px 20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    display:flex; flex-wrap:wrap; align-items:center;
    gap: 12px;
  }
  button.tool-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px;
    border-radius: 6px;
    transition: background-color 0.3s ease, transform 0.2s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  button.tool-btn svg {
    width: 28px;
    height: 28px;
    fill: #3b82f6;
    transition: fill 0.3s ease;
  }
  button.tool-btn span {
    font-size: 10px;
    color: #333;
    margin-top: 2px;
    user-select: none;
  }
  button.tool-btn:hover svg {
    fill: #2563eb;
  }
  button.tool-btn.active {
    background: #1e40af;
    transform: scale(0.9);
  }
  button.tool-btn.active svg {
    fill: white;
  }
  #color-picker {
    width: 40px;
    height: 40px;
    border: none;
    cursor: pointer;
    border-radius: 6px;
    padding: 0;
  }
  #size-slider {
    width: 120px;
    margin-left: 12px;
  }
  #size-label {
    min-width: 40px;
    text-align: center;
    color: #333;
    font-size: 14px;
  }
  #canvas {
    flex-grow: 1;
    background: white;
    display: block;
    width: 100%;
    border-top: 1px solid #ccc;
    touch-action: none;
    cursor: crosshair;
  }
  #img-upload-label {
    display:flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    padding: 8px;
    border-radius: 6px;
    border: 2px dashed #3b82f6;
    color: #3b82f6;
    font-weight: bold;
    user-select: none;
    width: 40px;
    height: 56px;
  }
  #img-upload-label:hover {
    background: #2563eb;
    color: white;
  }
  #img-upload-label svg {
    width: 28px;
    height: 28px;
    fill: currentColor;
    margin-bottom: 2px;
  }
  #file-input {
    display: none;
  }
</style>
</head>
<body>

<div id="tools">
  <!-- Иконки с подписями -->
  <button id="pencil-btn" class="tool-btn" title="Карандаш">
    <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM22.7 7.04a1 1 0 0 0 0-1.41l-2.3-2.3a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.79-1.87z"/></svg>
    <span>Карандаш</span>
  </button>

  <button id="line-btn" class="tool-btn" title="Прямая линия">
    <svg viewBox="0 0 24 24"><path d="M3 21h18v-2H5.41l14.3-14.29-1.42-1.42L3 17.59V21z"/></svg>
    <span>Линия</span>
  </button>

  <button id="triangle-btn" class="tool-btn" title="Треугольник">
    <svg viewBox="0 0 24 24"><path d="M12 2L3 21h18L12 2z"/></svg>
    <span>Треугольник</span>
  </button>

  <button id="star-btn" class="tool-btn" title="Звезда">
    <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
    <span>Звезда</span>
  </button>

  <button id="fill-btn" class="tool-btn" title="Заливка">
    <svg viewBox="0 0 24 24"><path d="M19 10.5V19H5v-8.5H3v10h18v-10z"/><path d="M7 10.5l2-3 3-3 3 3 2 3z"/></svg>
    <span>Заливка</span>
  </button>

  <button id="rectangle-btn" class="tool-btn" title="Прямоугольник">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" fill="none" stroke="#3b82f6" stroke-width="2"/></svg>
    <span>Прямоугольник</span>
  </button>

  <button id="circle-btn" class="tool-btn" title="Круг">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="#3b82f6" stroke-width="2"/></svg>
    <span>Круг</span>
  </button>

  <button id="text-btn" class="tool-btn" title="Текст">
    <svg viewBox="0 0 24 24"><path d="M5 21h14v-2H5v2zm7-19l-5 7h3v7h4v-7h3l-5-7z"/></svg>
    <span>Текст</span>
  </button>

  <button id="eraser-btn" class="tool-btn" title="Ластик">
    <svg viewBox="0 0 24 24"><path d="M16.24 7.76L7.76 16.24 5 18l2.76-2.76 8.48-8.48z"/><path d="M18.36 5.64l-1.83-1.83-2.82 2.82 1.83 1.83z"/></svg>
    <span>Ластик</span>
  </button>

  <label id="img-upload-label" title="Загрузить PNG">
    <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zm7-18l-5 5h3v6h4v-6h3l-5-5z"/></svg>
    <input id="file-input" type="file" accept="image/png" />
    <span>PNG</span>
  </label>

  <input type="color" id="color-picker" value="#000000" title="Выбор цвета" />

  <label for="size-slider" id="size-label">5</label>
  <input type="range" id="size-slider" min="1" max="50" value="5" title="Толщина" />
  
  <button id="download-btn" class="tool-btn" title="Скачать">
    <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zm7-18l-5 5h3v6h4v-6h3l-5-5z"/></svg>
    <span>Скачать</span>
  </button>
</div>

<canvas id="canvas"></canvas>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  const pencilBtn = document.getElementById('pencil-btn');
  const lineBtn = document.getElementById('line-btn');
  const triangleBtn = document.getElementById('triangle-btn');
  const starBtn = document.getElementById('star-btn');
  const fillBtn = document.getElementById('fill-btn');
  const rectangleBtn = document.getElementById('rectangle-btn');
  const circleBtn = document.getElementById('circle-btn');
  const textBtn = document.getElementById('text-btn');
  const eraserBtn = document.getElementById('eraser-btn');
  const downloadBtn = document.getElementById('download-btn');
  const colorPicker = document.getElementById('color-picker');
  const sizeSlider = document.getElementById('size-slider');
  const sizeLabel = document.getElementById('size-label');
  const fileInput = document.getElementById('file-input');
  const tools = document.getElementById('tools');

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight - tools.offsetHeight;
    redrawAll();
  }
  window.addEventListener('resize', resizeCanvas);

  let tool = 'pencil';
  let drawing = false;
  let startX=0, startY=0;
  let currentX=0, currentY=0;
  let size = +sizeSlider.value;
  let color = colorPicker.value;
  let currentLine = [];

  // Массив фигур и загруженных изображений {img, x, y}
  const shapes = [];
  const imagesOnCanvas = [];

  const buttons = [
    pencilBtn, lineBtn, triangleBtn, starBtn, fillBtn,
    rectangleBtn, circleBtn, textBtn, eraserBtn
  ];

  function setTool(t) {
    tool = t;
    updateActiveButton();
    canvas.style.cursor = (t === 'eraser') ? 'crosshair' : 'crosshair';
  }

  function updateActiveButton() {
    buttons.forEach(b => b.classList.remove('active'));
    switch(tool) {
      case 'pencil': pencilBtn.classList.add('active'); break;
      case 'line': lineBtn.classList.add('active'); break;
      case 'triangle': triangleBtn.classList.add('active'); break;
      case 'star': starBtn.classList.add('active'); break;
      case 'fill': fillBtn.classList.add('active'); break;
      case 'rectangle': rectangleBtn.classList.add('active'); break;
      case 'circle': circleBtn.classList.add('active'); break;
      case 'text': textBtn.classList.add('active'); break;
      case 'eraser': eraserBtn.classList.add('active'); break;
    }
  }

  pencilBtn.onclick = () => setTool('pencil');
  lineBtn.onclick = () => setTool('line');
  triangleBtn.onclick = () => setTool('triangle');
  starBtn.onclick = () => setTool('star');
  fillBtn.onclick = () => setTool('fill');
  rectangleBtn.onclick = () => setTool('rectangle');
  circleBtn.onclick = () => setTool('circle');
  textBtn.onclick = () => setTool('text');
  eraserBtn.onclick = () => setTool('eraser');

  colorPicker.oninput = e => {
    color = e.target.value;
  };
  sizeSlider.oninput = e => {
    size = +e.target.value;
    sizeLabel.textContent = size;
  };

  canvas.onmousedown = e => {
    const rect = canvas.getBoundingClientRect();
    startX = e.clientX - rect.left;
    startY = e.clientY - rect.top;

    if(tool === 'fill') {
      shapes.push({type: 'fill', color});
      redrawAll();
      return;
    }

    if(tool === 'text') {
      const text = prompt('Введите текст:');
      if(text) {
        shapes.push({type: 'text', text, x: startX, y: startY, color});
        redrawAll();
      }
      return; // нет drawing для текста
    }

    if(tool === 'eraser' || tool === 'pencil') {
      drawing = true;
      currentLine = [{x: startX, y: startY}];
      return;
    }

    if(['line','rectangle','circle','triangle','star'].includes(tool)) {
      drawing = true;
      return;
    }

    if(tool === 'image_upload_selected') {
      // Нет такого инструмента, загружаем изображение пока - не здесь
      return;
    }
  };

  canvas.onmousemove = e => {
    if(!drawing) return;
    const rect = canvas.getBoundingClientRect();
    currentX = e.clientX - rect.left;
    currentY = e.clientY - rect.top;

    ctx.lineCap = 'round';
    ctx.lineWidth = size;

    if(tool === 'pencil') {
      currentLine.push({x: currentX, y: currentY});
      ctx.strokeStyle = color;
      ctx.beginPath();
      const prev = currentLine[currentLine.length - 2];
      ctx.moveTo(prev.x, prev.y);
      ctx.lineTo(currentX, currentY);
      ctx.stroke();
    } else if(tool === 'eraser') {
      currentLine.push({x: currentX, y: currentY});
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = size;
      ctx.beginPath();
      const prev = currentLine[currentLine.length - 2];
      ctx.moveTo(prev.x, prev.y);
      ctx.lineTo(currentX, currentY);
      ctx.stroke();
    } else if(['rectangle','circle','triangle','star','line'].includes(tool)) {
      redrawAll();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = size;
      ctx.globalAlpha = 0.5;

      const w = currentX - startX;
      const h = currentY - startY;

      switch(tool) {
        case 'rectangle':
          ctx.fillRect(startX, startY, w, h);
          break;
        case 'circle':
          const radius = Math.hypot(w, h);
          ctx.beginPath();
          ctx.arc(startX, startY, radius, 0, 2 * Math.PI);
          ctx.fill();
          break;
        case 'triangle':
          ctx.beginPath();
          ctx.moveTo(startX, startY);
          ctx.lineTo(startX + w, startY + h);
          ctx.lineTo(startX - w, startY + h);
          ctx.closePath();
          ctx.fill();
          break;
        case 'star':
          drawStar(ctx, startX, startY, Math.min(Math.abs(w), Math.abs(h)) / 2, 5);
          ctx.fill();
          break;
        case 'line':
          ctx.beginPath();
          ctx.moveTo(startX, startY);
          ctx.lineTo(currentX, currentY);
          ctx.stroke();
          break;
      }
      ctx.globalAlpha = 1.0;
    }
  };

  canvas.onmouseup = e => {
    if(!drawing) return;
    drawing = false;

    const rect = canvas.getBoundingClientRect();
    const endX = e.clientX - rect.left;
    const endY = e.clientY - rect.top;

    if(tool === 'pencil' || tool === 'eraser') {
      if(currentLine.length > 1) {
        shapes.push({
          type: tool, 
          points: currentLine.slice(),
          color: tool === 'eraser' ? '#fff' : color,
          size
        });
      }
      currentLine = [];
    } else if(['rectangle','circle','triangle','star','line'].includes(tool)) {
      const w = endX - startX;
      const h = endY - startY;

      switch(tool) {
        case 'rectangle':
          shapes.push({type:'rect', x:startX, y:startY, width:w, height:h, color});
          break;
        case 'circle':
          const radius = Math.hypot(w,h);
          shapes.push({type:'circle', x:startX, y:startY, radius, color});
          break;
        case 'triangle':
          shapes.push({type:'triangle', x:startX, y:startY, width:w, height:h, color});
          break;
        case 'star':
          const sizeStar = Math.min(Math.abs(w), Math.abs(h))/2;
          shapes.push({type:'star', x:startX, y:startY, size: sizeStar, spikes:5, color});
          break;
        case 'line':
          shapes.push({type:'line', x1:startX, y1:startY, x2:endX, y2:endY, color, size});
          break;
      }
      redrawAll();
    }
  };

  // Загрузка PNG изображения
  fileInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/png')) {
      alert('Пожалуйста, выберите PNG изображение.');
      return;
    }

    const img = new Image();
    img.onload = () => {
      // Ждём, пока загружено, добавляем объект
      // Добавим в imagesOnCanvas, позицию будет 10,10 (можно доработать - поставить в центр)
      imagesOnCanvas.push({img, x: 10, y: 10, width: img.width, height: img.height});
      redrawAll();
      fileInput.value = ''; // сбросить input
    };
    img.onerror = () => alert('Ошибка загрузки изображения.');
    img.src = URL.createObjectURL(file);
  });

  function drawStar(ctx, cx, cy, outerRadius, spikes) {
    const innerRadius = outerRadius / 2.5;
    let rot = Math.PI / 2 * 3;
    let x = cx;
    let y = cy;
    const step = Math.PI / spikes;
    ctx.beginPath();
    ctx.moveTo(cx, cy - outerRadius);
    for(let i=0; i < spikes; i++) {
      x = cx + Math.cos(rot) * outerRadius;
      y = cy + Math.sin(rot) * outerRadius;
      ctx.lineTo(x, y);
      rot += step;
      x = cx + Math.cos(rot) * innerRadius;
      y = cy + Math.sin(rot) * innerRadius;
      ctx.lineTo(x, y);
      rot += step;
    }
    ctx.lineTo(cx, cy - outerRadius);
    ctx.closePath();
  }

  function redrawAll() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    const fillShape = [...shapes].reverse().find(s=>s.type==='fill');
    if(fillShape){
      ctx.fillStyle = fillShape.color;
      ctx.fillRect(0,0,canvas.width,canvas.height);
    }

    // Рисуем загруженные изображения
    imagesOnCanvas.forEach(({img,x,y,width,height})=>{
      ctx.drawImage(img,x,y,width,height);
    });

    for(let s of shapes){
      switch(s.type){
        case 'pencil':
          ctx.strokeStyle = s.color;
          ctx.lineWidth = s.size || 2;
          ctx.lineCap = 'round';
          ctx.beginPath();
          for(let i=0; i<s.points.length-1; i++){
            ctx.moveTo(s.points[i].x,s.points[i].y);
            ctx.lineTo(s.points[i+1].x,s.points[i+1].y);
          }
          ctx.stroke();
          break;
        case 'eraser':
          ctx.strokeStyle = "#fff";
          ctx.lineWidth = s.size || 10;
          ctx.lineCap = 'round';
          ctx.beginPath();
          for(let i=0; i<s.points.length-1; i++){
            ctx.moveTo(s.points[i].x,s.points[i].y);
            ctx.lineTo(s.points[i+1].x,s.points[i+1].y);
          }
          ctx.stroke();
          break;
        case 'line':
          ctx.strokeStyle = s.color;
          ctx.lineWidth = s.size || 2;
          ctx.beginPath();
          ctx.moveTo(s.x1,s.y1);
          ctx.lineTo(s.x2,s.y2);
          ctx.stroke();
          break;
        case 'rect':
          ctx.fillStyle = s.color;
          ctx.fillRect(s.x,s.y,s.width,s.height);
          break;
        case 'circle':
          ctx.fillStyle = s.color;
          ctx.beginPath();
          ctx.arc(s.x,s.y,s.radius,0,2*Math.PI);
          ctx.fill();
          break;
        case 'triangle':
          ctx.fillStyle = s.color;
          ctx.beginPath();
          ctx.moveTo(s.x,s.y);
          ctx.lineTo(s.x + s.width,s.y + s.height);
          ctx.lineTo(s.x - s.width,s.y + s.height);
          ctx.closePath();
          ctx.fill();
          break;
        case 'star':
          ctx.fillStyle = s.color;
          drawStar(ctx,s.x,s.y,s.size,s.spikes);
          ctx.fill();
          break;
        case 'text':
          ctx.fillStyle = s.color || '#000';
          ctx.font = '24px Arial';
          ctx.fillText(s.text, s.x, s.y);
          break;
        case 'fill':
          // Уже залито выше
          break;
      }
    }
  }

  downloadBtn.onclick = () => {
    const dataURL = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = dataURL;
    a.download = 'art.png';
    a.click();
  };

  // Инициализация
  resizeCanvas();
  setTool('pencil');
  sizeLabel.textContent = size;

</script>

</body>
</html>
