<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конвертер PNG в GIF</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Конвертер PNG в GIF</h1>
    <input type="file" id="files" multiple accept=".png">
    <button id="convert-button">Конвертировать в GIF</button>
    <div id="gif-container"></div>

    <script>
      const filesInput = document.getElementById('files');
      const convertButton = document.getElementById('convert-button');
      const gifContainer = document.getElementById('gif-container');

      convertButton.addEventListener('click', async () => {
        const files = filesInput.files;
        if (files.length === 0) {
          alert('Не выбраны файлы');
          return;
        }

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const gif = [];

        for (const file of files) {
          const img = new Image();
          img.src = URL.createObjectURL(file);
          await new Promise(resolve => {
            img.onload = resolve;
          });
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          gif.push(canvas.toDataURL());
        }

        const gifBlob = await createGif(gif);
        const gifUrl = URL.createObjectURL(gifBlob);
        const gifImage = document.createElement('img');
        gifImage.src = gifUrl;
        gifContainer.innerHTML = '';
        gifContainer.appendChild(gifImage);
      });

      async function createGif(frames) {
        const gifBlob = new Blob();
        const gifEncoder = new GIFEncoder();
        gifEncoder.setRepeat(0);
        gifEncoder.setDelay(100);
        for (const frame of frames) {
          const img = await loadImage(frame);
          gifEncoder.addFrame(img);
        }
        gifEncoder.finish();
        const buffer = gifEncoder.stream.getBuffer();
        return new Blob([buffer], {type: 'image/gif'});
      }

      async function loadImage(url) {
        const img = new Image();
        img.src = url;
        await new Promise(resolve => {
          img.onload = resolve;
        });
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        return canvas;
      }
    </script>
  </div>
</body>
</html>
