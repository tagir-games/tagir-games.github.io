<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер PNG в GIF</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Конвертер PNG в GIF</h1>
    <input type="file" id="files" multiple accept=".png">
    <button id="convert">Преобразовать в GIF</button>
    <div id="result"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
    <script>
        const filesInput = document.getElementById('files');
        const convertButton = document.getElementById('convert');
        const resultDiv = document.getElementById('result');

        convertButton.addEventListener('click', async () => {
            const files = filesInput.files;
            if (files.length === 0) {
                alert('Не выбраны файлы');
                return;
            }

            const images = [];
            for (const file of files) {
                const img = new Image();
                img.src = URL.createObjectURL(file);
                await new Promise(resolve => {
                    img.onload = resolve;
                });
                images.push(img);
            }

            const gif = new GIF({
                workers: 2,
                quality: 10
            });

            for (const img of images) {
                gif.addFrame(img, { delay: 100 });
            }

            gif.on('finished', async () => {
                const blob = await gif.getBlob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'result.gif';
                a.click();
                URL.revokeObjectURL(url);
            });

            gif.render();
        });
    </script>
</body>
</html>
