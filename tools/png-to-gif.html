<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конвертер PNG в GIF</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Конвертер PNG в GIF</h1>
    <input type="file" id="files" multiple accept=".png">
    <button id="convert-button">Конвертировать в GIF</button>
    <div id="gif-container"></div>

    <script src="https://unpkg.com/gif.js@0.2.0/dist/gif.js"></script>
    <script>
      class GifConverter {
        constructor() {
          this.frames = [];
          this.gif = new GIF({
            repeat: 0,
            delay: 100,
          });
        }

        addFrame(image) {
          this.frames.push(image);
        }

        convertToGif() {
          return new Promise((resolve, reject) => {
            this.gif.on('finished', () => {
              this.gif.getBuffer((err, buffer) => {
                if (err) {
                  reject(err);
                } else {
                  const blob = new Blob([buffer], {type: 'image/gif'});
                  resolve(blob);
                }
              });
            });
            this.frames.forEach((frame) => {
              this.gif.addFrame(frame);
            });
            this.gif.render();
          });
        }
      }

      function readImage(file) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => {
            resolve(img);
          };
          img.onerror = () => {
            reject(new Error('Ошибка загрузки изображения'));
          };
          img.src = URL.createObjectURL(file);
        });
      }

      async function convertImagesToGif(files) {
        const converter = new GifConverter();
        for (const file of files) {
          const image = await readImage(file);
          converter.addFrame(image);
        }
        const gifBlob = await converter.convertToGif();
        return gifBlob;
      }

      const filesInput = document.getElementById('files');
      const convertButton = document.getElementById('convert-button');
      const gifContainer = document.getElementById('gif-container');

      convertButton.addEventListener('click', async () => {
        const files = filesInput.files;
        if (files.length === 0) {
          alert('Не выбраны файлы');
          return;
        }

        try {
          const gifBlob = await convertImagesToGif(files);
          const gifUrl = URL.createObjectURL(gifBlob);
          const gifImage = document.createElement('img');
          gifImage.src = gifUrl;
          gifContainer.innerHTML = '';
          gifContainer.appendChild(gifImage);
        } catch (error) {
          alert('Ошибка конвертации: ' + error.message);
        }
      });
    </script>
  </div>
</body>
</html>
