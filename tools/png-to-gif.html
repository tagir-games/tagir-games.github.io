<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конвертер PNG в GIF</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Конвертер PNG в GIF</h1>
    <input type="file" id="files" multiple accept=".png">
    <button id="convert-button">Конвертировать в GIF</button>
    <div id="gif-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/gifencoder@1.1.0/dist/gifencoder.min.js"></script>
    <script>
      const filesInput = document.getElementById('files');
      const convertButton = document.getElementById('convert-button');
      const gifContainer = document.getElementById('gif-container');

      convertButton.addEventListener('click', async () => {
        const files = filesInput.files;
        if (files.length === 0) {
          alert('Не выбраны файлы');
          return;
        }

        const canvas = document.createElement('canvas');
        const gif = new GIFEncoder();
        gif.setRepeat(0);
        gif.setDelay(100);

        for (const file of files) {
          const img = new Image();
          img.src = URL.createObjectURL(file);
          await new Promise(resolve => {
            img.onload = resolve;
          });
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          gif.addFrame(canvas);
        }

        gif.finish();

        const blob = new Blob([gif.stream.getBuffer()], {type: 'image/gif'});
        const url = URL.createObjectURL(blob);
        const img = document.createElement('img');
        img.src = url;
        gifContainer.innerHTML = '';
        gifContainer.appendChild(img);
      });
    </script>
  </div>
</body>
</html>
