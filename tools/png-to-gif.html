<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNG в GIF Конвертер</title>
    <script src="https://cdn.rawgit.com/jnordberg/gif.js/master/dist/gif.js"></script>
</head>
<body>
    <h1>Конвертер PNG в GIF</h1>
    <input type="file" id="fileInput" multiple accept="image/png">
    <button id="convertBtn">Конвертировать в GIF</button>
    <br>
    <img id="gifOutput" alt="GIF результат" />
    
    <script>
        document.getElementById('convertBtn').addEventListener('click', function() {
            const input = document.getElementById('fileInput');
            const files = input.files;

            if (files.length === 0) {
                alert('Пожалуйста, выберите хотя бы одно изображение PNG.');
                return;
            }

            const gif = new GIF({
                workers: 2,
                quality: 10,
            });

            let loadedImages = 0;

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d', { willReadFrequently: true });
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.drawImage(img, 0, 0);
                        
                        gif.addFrame(canvas, { delay: 200 });
                        loadedImages++;
                        if (loadedImages === files.length) {
                            gif.render();
                        }
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });

            gif.on('finished', function(blob) {
                const gifOutput = document.getElementById('gifOutput');
                gifOutput.src = URL.createObjectURL(blob);
            });
        });
    </script>
</body>
</html>
