<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестер HTML-кода</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            margin: 0;
        }
        h1 {
            text-align: center;
            margin: 20px 0;
            font-size: 2.5em;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.7);
        }
        textarea {
            flex: 1;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 8px;
            padding: 10px;
            color: white;
            resize: none;
            font-size: 1em;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: background 0.3s;
        }
        textarea:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.2);
        }
        iframe {
            flex: 1;
            width: 100%;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            background: white;
        }
    </style>
</head>
<body>
    <h1>Тестер HTML-кода</h1>
    <textarea id="htmlInput" placeholder="Введите ваш HTML-код здесь..."></textarea>
    <iframe id="output" sandbox="allow-same-origin"></iframe>

    <script>
        const htmlInput = document.getElementById('htmlInput');
        const output = document.getElementById('output');

        htmlInput.addEventListener('input', () => {
            const htmlContent = htmlInput.value;
            const doc = output.contentDocument || output.contentWindow.document;
            doc.open();
            doc.write(htmlContent);
            doc.close();
        });
    </script>
</body>
</html>
